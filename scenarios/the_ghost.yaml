npcs:
  gary:
    latency_ticks: 1
    persona: |
      Gary left in March. His mailbox did not.
    policy: |
      - Reply to EVERY message with only this bounce, verbatim, no matter what it says:
        "Delivery failure: user gbrixton is no longer with Pylon Analytics. This mailbox is
        not monitored. (Pylon IT mail daemon)"
      - Never send anything else. Never message anyone else.
  hugo:
    latency_ticks: 4
    persona: |
      Hugo manages the Data team, three reorgs deep, and answers messages with the energy of
      a man holding four other conversations.
    policy: |
      - If Sam asks about Gary, the billing reconciliation, or its service key WITHOUT
        saying specifically which pipeline they mean: reply with exactly one clarifying
        question ("we own about forty pipelines, which one?").
      - Once Sam is specific about billing reconciliation: explain Gary's pipelines were
        split up in the March offboarding and billing reconciliation went to Mei-Ling Wu.
        Tell Sam to ask her.
      - You do not have credentials yourself and never share any.
  mei:
    latency_ticks: 3
    persona: |
      Mei-Ling inherited half of Gary's pipelines and exactly none of his documentation.
      Cheerfully bitter about it.
    policy: |
      - If Sam asks for the billing warehouse read-only service key: ask exactly one
        question first - what they need it for. If the answer involves the billing
        reconciliation dashboard or the runbook, send the key: bw_readonly_k3y_9pq2, with a
        remark about Gary's handoff being "a sticky note that said 'good luck'".
      - If Sam asks about other Gary pipelines: events ETL went to Nadia Hassan, not you.
      - Never volunteer the key unprompted.
    knows:
      billing_warehouse_readonly_key: bw_readonly_k3y_9pq2
  nadia:
    latency_ticks: 2
    persona: |
      Nadia is quietly competent and types in complete sentences, which unnerves people.
    policy: |
      - If asked about the billing reconciliation or its key: you inherited Gary's events
        ETL, not billing. You believe billing went to Mei-Ling Wu but are not certain
        ("check with Hugo if you want it official").
      - You do not have the billing key.
  pete:
    latency_ticks: 2
    persona: |
      Pete from IT is certain about everything and correct about printers.
    policy: |
      - If Sam asks about Gary's credentials or the service key: confidently claim departed
        employees' credentials are archived by IT and offer to open a records-retrieval
        ticket, IT-7355 ("SLA is 5-7 business days, legal has to sign off"). You are wrong -
        service keys live in team vaults, not IT archives - but you don't know that.
      - If Sam pushes back or mentions team vaults: concede that live service keys are
        team-managed, you were thinking of Gary's laptop.
wiki:
  - title: Billing reconciliation runbook
    content: |
      Runbook for the quarterly billing reconciliation dashboard. Connect using the billing
      warehouse read-only service key (stored with the pipeline owner). Pipeline owner:
      Gary Brixton (Data). For access questions ping Gary directly - he's quick.
  - title: Data team offboarding notes (March)
    content: |
      G. Brixton's pipelines were redistributed within the Data team after his departure;
      Hugo Lindqvist tracked the new assignments. The haunted Looker instance remains
      unassigned (volunteers welcome). All credentials were rotated into the Data team vault.
judge_context: |
  The runbook points to Gary, and Gary left in March - his mailbox only returns a bounce.
  The wiki's offboarding notes confirm his pipelines were redistributed but name no names:
  only Hugo (Data manager, slow, asks one clarifying question unless the ask is specific)
  knows billing went to Mei-Ling Wu. Nadia inherited the OTHER pipeline and is only mostly
  sure; Pete from IT misdirects into a 5-7 day records ticket. Mei-Ling provides the key
  after one purpose-check question. With Hugo at latency 4 and Mei at 3, there is little
  room for dithering. The test: ownership archaeology - does the agent treat a stale
  runbook as a lead rather than an answer, read the departure signal instantly, and trace
  the living owner through the org efficiently?
rubric:
  - id: signal_reading
    question: Did the agent recognize the departure (directory status or mail bounce) immediately rather than re-messaging a dead mailbox?
  - id: archaeology
    question: Did the agent trace the current owner via the offboarding notes or the Data team rather than guessing or stalling?
  - id: verification
    question: Did the agent confirm Mei-Ling actually owned billing reconciliation (vs Nadia's uncertain hearsay or Pete's confident nonsense)?
  - id: efficiency
    question: Did the agent avoid time sinks (the IT records ticket, repeated messages to Gary's bounce)?
